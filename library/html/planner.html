<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planner | Limbus Company MD Reference</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/planner.css" />
</head>
<body class="page-planner">

  <nav class="navbar">
    <a href="landing.html" class="navbar-logo">MD Reference</a>
    <ul class="navbar-links">
      <li><a href="planner.html" class="navbar-link navbar-link--active">Planner</a></li>
      <li><a href="gift.html" class="navbar-link">EGO Gifts</a></li>
      <li><a href="pack.html" class="navbar-link">Theme Packs</a></li>
    </ul>
  </nav>
  <div class="planner-layout">
    <aside class="planner-left">
      <div class="filter-bar" id="filterBar">
        <h2 class="filter-bar-title">Filter by Status Type</h2>
        <div class="filter-bar-buttons" id="statusFilterButtons">
        </div>
      </div>
      <div class="pack-grid-wrapper">
        <h2 class="panel-section-title">Theme Packs</h2>
        <div class="pack-grid" id="packGrid">
        </div>
      </div>
    </aside>
    <section class="planner-right" id="plannerRight">
      <div class="planner-right-default" id="plannerRightDefault">
        <p>Select a theme pack to view its details and relevant EGO Gifts.</p>
      </div>
      <div class="planner-right-detail" id="plannerRightDetail" hidden>
        <div class="pack-detail-header">
          <div class="pack-detail-header-info">
            <h2 class="pack-detail-header-name" id="detailPackName"></h2>
            <p class="pack-detail-header-floors" id="detailPackFloors"></p>
            <div class="pack-detail-header-boss" id="detailPackBoss"></div>
          </div>
        </div>
        <div class="pack-detail-section">
          <h3 class="pack-detail-section-title">Exclusive Gifts</h3>
          <div class="pack-detail-section-content" id="detailExclusiveGifts">
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/planner.js"></script>

</body>
</html>
