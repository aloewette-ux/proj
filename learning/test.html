<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="carousel">
  <!-- Main Slides -->
  <div class="carousel-slides">
    <div class="slide active" data-index="0">
      <img src="./test_images/cat.jpg" alt="Photo 1">
      <div class="caption">Description 1</div>
    </div>
    <div class="slide" data-index="1">
      <img src="./test_images/cat1.jpg" alt="Photo 2">
      <div class="caption">Description 2</div>
    </div>
    <div class="slide" data-index="2">
      <img src="./test_images/cat2.jpg" alt="Photo 3">
      <div class="caption">Description 3</div>
    </div>
  </div>

  <!-- Navigation -->
  <button class="prev">←</button>
  <button class="next">→</button>

  <!-- Thumbnail Navigation (optional) -->
  <div class="carousel-thumbnails">
    <div class="thumb active" data-index="0">
      <img src="./test_images/cat.jpg" alt="Thumb 1">
    </div>
    <div class="thumb" data-index="1">
      <img src="./test_images/cat1.jpg" alt="Thumb 2">
    </div>
    <div class="thumb" data-index="2">
      <img src="./test_images/cat2.jpg" alt="Thumb 3">
    </div>
  </div>
</body>
</html>
